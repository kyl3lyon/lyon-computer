<body class="archive-template computer tag-studies">
<header class="container bottom-6">
    <div class="columns">
        <div class="column">
            <div class="navbar">
                <div class="navbar-section measure-12 measure-8-phone"><h2>Navigation</h2></div>
                <div class="navbar-section"><h2><span class="h2-normal">~ / <a href="/" title="Home">Home</a> / <span id="crumb-type">Studies</span></span></h2></div>
            </div>
        </div>
    </div>
</header>
<main class="measure-60 measure-36-tablet responsive-24-phone">
    <div class="container">
        <h2 id="archive-title">Studies Index</h2>
        <div class="columns bottom-1">
            <div class="column flex-measure-60 bottom-1">
                <table class="table">
                    <thead class="black bg-light-gray ba b--black">
                    <tr>
                        <th class="measure-12 measure-8-phone">Date</th>
                        <th>Title</th>
                        <th class="measure-6 hide-phone">Link</th>
                    </tr>
                    </thead>
                    <tbody id="archive-tbody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <p class="container">
        <a class="top-2 btn bg-dark-green white hover-white hover-bg-black" href="/">← Back to Home</a>
    </p>
</main>
<footer class="top-4 moon-gray">
    <small>© Copyright 2025, Kyle Lyon. <a href="/acknowledgements/">Acknowledgements</a>.</small>
</footer>
<script>var __b=''; window.__BASEURL__='';</script>
<script>
(function() {
  "use strict";
  
  const type = "studies";
  const BASEURL = (typeof window !== "undefined" && window.__BASEURL__) ? window.__BASEURL__ : "";
  const ROOT = BASEURL ? (BASEURL.endsWith('/') ? BASEURL : BASEURL + '/') : '/';

  async function loadItems() {
    try {
      const res = await fetch(`${ROOT}assets/data/${type}.json`, { cache: "no-store" });
      if (!res.ok) {
        console.error(`Failed to load data for ${type}`);
        return [];
      }
      const data = await res.json();
      return data.items && Array.isArray(data.items) ? data.items : [];
    } catch (err) {
      console.error(`Error fetching ${type}.json:`, err);
      return [];
    }
  }

  function renderRows(items) {
    const tbody = document.getElementById("archive-tbody");
    if (!tbody) return;

    if (!items || items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3">No items found.</td></tr>';
      return;
    }

    let rowsHtml = "";
    
    for (const item of items) {
      const slug = item.href.split('slug=')[1] || item.href.split('/').pop();
      const cleanUrl = `${ROOT}studies/${slug}`;
      const linkTitle = `View Study - ${item.title}`;
      rowsHtml += `
        <tr>
          <td>
            <time datetime="${item.date}">${item.date}</time>
          </td>
          <td>
            <a href="${cleanUrl}" title="${item.title}">${item.title}</a>
          </td>
          <td class="hide-phone">
            <a class="btn btn-sm bg-dark-green white hover-white hover-bg-black measure-6" href="${cleanUrl}" title="${linkTitle}">View →</a><br/>
          </td>
        </tr>
      `;
    }
    tbody.innerHTML = rowsHtml;
  }

  async function init() {
    const items = await loadItems();
    renderRows(items);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
