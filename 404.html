<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Redirecting…</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <link href="assets/css/lyon-wds.min.css" rel="stylesheet">
    <link href="assets/css/computer.css" rel="stylesheet">
</head>
<body class="computer">
    <main class="container measure-48 top-4">
        <h2>Redirecting…</h2>
        <p>If you are not redirected automatically, <a id="redirect-link" href="/">go to Home</a>.</p>
    </main>
    <script>var __b='{{ site.baseurl }}'; window.__BASEURL__=(__b&&__b.indexOf('{')===-1)?__b:'';</script>
    <script>
      (function() {
        var BASEURL = (typeof window !== 'undefined' && window.__BASEURL__) ? window.__BASEURL__ : '';
        var ROOT = BASEURL ? (BASEURL.endsWith('/') ? BASEURL : BASEURL + '/') : '/';
        var path = window.location.pathname || '';
        if (BASEURL && path.startsWith(BASEURL)) path = path.slice(BASEURL.length);
        path = path.replace(/^\/+/, '').replace(/\/+$/,'');

        var types = ['notes','projects','studies','media'];
        var parts = path.split('/');
        var target = ROOT;

        if (parts.length === 1 && types.includes(parts[0])) {
          // /notes -> archive for type
          target = ROOT + 'archive.html?type=' + parts[0];
        } else if (parts.length === 2 && types.includes(parts[0])) {
          // /notes/slug -> post for type+slug
          target = ROOT + 'post.html?type=' + parts[0] + '&slug=' + encodeURIComponent(parts[1]);
        } else if (parts.length === 2 && types.includes(parts[0]) && parts[1] === 'archive.html') {
          // /notes/archive.html -> archive
          target = ROOT + 'archive.html?type=' + parts[0];
        } else if (parts.length === 1 && parts[0] === 'archive.html') {
          target = ROOT + 'archive.html';
        }

        document.getElementById('redirect-link').setAttribute('href', target);
        try { window.location.replace(target); } catch (e) { window.location.href = target; }
      })();
    </script>
</body>
</html>
